<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101116">
  <title>SkyRush</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header><div class="brand"><span class="brand-mark">✈</span> SKYRUSH</div><div class="tag">ARCADE MODE</div></header>
    <section class="stats">
      <div><small>ВИРТУАЛЬНЫЕ ОЧКИ</small><strong id="balance">1 000</strong></div>
      <div class="right"><small>ЛУЧШИЙ РЕЗУЛЬТАТ</small><strong id="best">—</strong></div>
    </section>
    <section class="stage">
      <div class="sky-glow"></div>
      <div class="stars">✦　 ·　　 ✧　　 ·　 ✦</div>
      <div class="plane" id="plane">✈</div>
      <div class="multiplier" id="multiplier">1.00x</div>
      <div class="status" id="status">ГОТОВ К ПОЛЁТУ?</div>
      <svg class="flight-line" viewBox="0 0 340 120" preserveAspectRatio="none" aria-hidden="true">
        <path id="flightPath" d="M0 112 Q70 108 110 85 T220 48 T340 8" />
      </svg>
    </section>
    <section class="controls">
      <div class="stake-row"><span>Игровая попытка</span><strong>50 очков</strong></div>
      <button id="play" class="main-button">НАЧАТЬ ПОЛЁТ</button>
      <button id="collect" class="collect-button" disabled>ЗАФИКСИРОВАТЬ ОЧКИ</button>
      <p class="hint" id="hint">Очки виртуальные и не имеют денежной стоимости.</p>
    </section>
    <section class="history">
      <div class="section-title">ПОСЛЕДНИЕ ПОЛЁТЫ <span>ИСТОРИЯ</span></div>
      <div id="historyList" class="history-list"><span class="empty">Пока нет завершённых раундов</span></div>
    </section>
    <footer>SKYRUSH · ИГРА ДЛЯ РАЗВЛЕЧЕНИЯ · БЕЗ ДЕНЕЖНЫХ СТАВОК</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
